{% extends 'emsapp/base.html' %}

{% block title %}Confirm Delete – EMS{% endblock %}

{% block content %}
<div class="text-center">
    <h2 class="mb-4">Delete Employee</h2>
    <p>Are you sure you want to delete <strong>{{ employee.e_name }}</strong>?</p>
    <form method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
    <a href="{% url 'display' %}" class="btn btn-secondary ms-2">Cancel</a>
</div>
{% endblock %}
