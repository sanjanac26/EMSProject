{% extends 'emsapp/base.html' %}

{% block title %}Edit Employee – EMS{% endblock %}

{% block content %}
<h2 class="mb-4">Edit Employee</h2>
<form method="post" class="row g-3" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Update</button>
    </div>
</form>
{% endblock %}
